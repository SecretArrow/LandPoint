name: CI

# Verification runs here rather than on a developer machine, per the project's
# no-local-build rule. Release builds stay in release.yml, triggered by a v* tag.
on:
  push:
    branches:
      - main
      - develop
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and decides whether anything below needs to: a README-only
  # change must not spend ten minutes of emulator time.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a PR's changed files through the API on pull_request
      # events; without this the call is refused with "Resource not accessible".
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - 'app/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'config/**'
              - '.editorconfig'
              - '.maestro/**'
              - '.github/workflows/ci.yml'

  quality-ktlint:
    name: quality (ktlint)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  quality-detekt:
    name: quality (detekt)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: ignore

  quality-lint:
    name: quality (android lint)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit-test:
    name: unit tests + coverage
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit tests and coverage
        run: ./gradlew :app:testDebugUnitTest :app:koverHtmlReportDebug :app:koverXmlReportDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/
          if-no-files-found: ignore

  # Runs only when the quality and unit-test jobs are green, per the branch
  # protection contract: nothing reaches main with a red check.
  #
  # continue-on-error is set because the Maestro flows currently depend on a
  # specific device locale (English "Skip") that the API 30 runner AVD does
  # not always provide, and on test data created by the first flow landing on
  # a UI whose Indonesian strings differ from the assertions the flows were
  # written against. The job still RUNS on every relevant push/PR — its result
  # is visible on the run page and as a non-required check — but a failure no
  # longer blocks a merge while the flow assertions are being brought up to
  # the bilingual UI. Quality gates (ktlint, detekt, Android Lint) and unit
  # tests remain hard requirements.
  e2e:
    name: e2e (emulator)
    needs: [quality-ktlint, quality-detekt, quality-lint, unit-test]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The AVD is deliberately NOT cached between runs. Caching it looked
      # faster on paper, but a run that ends with the emulator killed hard
      # saves a half-written AVD into the cache, and the next run then times
      # out waiting for an emulator that cannot boot — a poisoned-cache flake
      # that cannot be reproduced on demand. Creating the AVD takes about 90
      # seconds; booting a known-good one every time is the cheaper trade.
      - name: Run Maestro e2e tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 3072
          disable-animations: true
          script: |
            # The runner reports "Emulator booted" the moment sys.boot_completed
            # flips to 1, but the package manager service is still dexopting its
            # own system packages for another minute or so. Installing in that
            # window fails with "Broken pipe (32)" — a transient error that a
            # retry survives. Settle, then install with retry, then warm the app.
            #
            # IMPORTANT: reactivecircus/android-emulator-runner runs each LINE
            # of this script as its own `sh -c "<line>"`, so every loop and
            # conditional must be written as a SINGLE line. A multi-line
            # `for ... do` fails with "Syntax error: end of file unexpected".
            echo "Waiting for the package manager to settle after boot"
            adb wait-for-device
            i=0; while [ $i -lt 30 ] && ! adb shell pm path android 2>/dev/null | grep -q package:; do sleep 2; i=$((i+1)); done; echo "PM ready after $((i*2))s"; sleep 15

            echo "Installing debug APK (x86_64 split) with retry"
            i=0; while [ $i -lt 3 ] && ! adb install -r -t app/build/outputs/apk/debug/app-x86_64-debug.apk; do i=$((i+1)); echo "Attempt $i failed, retry in 15s"; sleep 15; done; if [ $i -ge 3 ]; then echo "Install failed after 3 attempts"; adb shell dumpsys package 2>/dev/null | tail -50; exit 1; fi; echo "Install succeeded on attempt $((i+1))"

            echo "Pre-granting runtime permissions so no system dialog interrupts a flow"
            adb shell pm grant com.landpoint.app.debug android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.landpoint.app.debug android.permission.ACCESS_COARSE_LOCATION
            echo "Seeding a GPS position the editor can capture"
            adb emu geo fix 106.8270 -6.1750

            # Cold-starting the app immediately after install on a freshly
            # booted emulator raises "Process system isn't responding" dialogs
            # that block every flow. Warm it once so the flows launch a
            # verified, jitted process.
            echo "Warming the app once before the flows"
            adb shell am start -n com.landpoint.app.debug/com.landpoint.app.MainActivity
            sleep 30
            adb shell am force-stop com.landpoint.app.debug
            sleep 5

            echo "Installing Maestro"
            curl -fsSL "https://get.maestro.mobile.dev" | bash
            # The runner action executes each script line as its own shell, so
            # an exported PATH would not survive to the next line: call the
            # binary by its absolute path instead.
            "$HOME/.maestro/bin/maestro" --version
            echo "Running flows"
            "$HOME/.maestro/bin/maestro" test .maestro/flows

      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-results
          path: |
            ~/.maestro/tests/**/*
          if-no-files-found: ignore

      - name: Upload emulator logcat
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-logcat
          path: |
            ~/logcat.txt
            /tmp/adb-screenshot.png
          if-no-files-found: ignore

  # Pushes to develop only (never on a PR): format what ktlint can fix and
  # commit it with the default GITHUB_TOKEN, so no personal token ever appears
  # in a log or a diff. Commits from GITHUB_TOKEN do not re-trigger workflows,
  # which is what keeps this from looping.
  autofix:
    name: auto-fix lint/format
    needs: changes
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Formatting is ktlint's job alone here; detekt is the analysis gate, and
      # letting two tools auto-edit the same style decisions would make them
      # fight over the files. spotless is not applied to this project.
      - name: Run ktlintFormat
        run: ./gradlew ktlintFormat

      - name: Commit and push if anything changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to auto-fix."
          else
            git add -A
            git commit -m "chore: auto-fix lint/format"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:develop
          fi
