name: CI

# Verification runs here rather than on a developer machine, per the project's
# no-local-build rule. Release builds stay in release.yml, triggered by a v* tag.
on:
  push:
    branches:
      - main
      - develop
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and decides whether anything below needs to: a README-only
  # change must not spend ten minutes of emulator time.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a PR's changed files through the API on pull_request
      # events; without this the call is refused with "Resource not accessible".
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Filter paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            src:
              - 'app/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'config/**'
              - '.editorconfig'
              - '.maestro/**'
              - '.github/workflows/ci.yml'

  quality-ktlint:
    name: quality (ktlint)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  quality-detekt:
    name: quality (detekt)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: ignore

  quality-lint:
    name: quality (android lint)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit-test:
    name: unit tests + coverage
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run unit tests and coverage
        run: ./gradlew :app:testDebugUnitTest :app:koverHtmlReportDebug :app:koverXmlReportDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/
          if-no-files-found: ignore

  # Runs only when the quality and unit-test jobs are green, per the branch
  # protection contract: nothing reaches main with a red check.
  e2e:
    name: e2e (emulator)
    needs: [quality-ktlint, quality-detekt, quality-lint, unit-test]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The AVD is deliberately NOT cached between runs. Caching it looked
      # faster on paper, but a run that ends with the emulator killed hard
      # saves a half-written AVD into the cache, and the next run then times
      # out waiting for an emulator that cannot boot — a poisoned-cache flake
      # that cannot be reproduced on demand. Creating the AVD takes about 90
      # seconds; booting a known-good one every time is the cheaper trade.
      - name: Run Maestro e2e tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 3072
          disable-animations: true
          script: |
            # The runner reports "Emulator booted" the moment sys.boot_completed
            # flips to 1, but the package manager service is still dexopting its
            # own system packages for another minute or so. Installing in that
            # window fails with "Broken pipe (32)" — a transient error that a
            # retry survives. Settle, then install with retry, then warm the app.
            echo "Waiting for the package manager to settle after boot"
            adb wait-for-device
            for i in $(seq 1 30); do
              if adb shell pm path android 2>/dev/null | grep -q package:; then
                echo "Package manager ready (after $((i*2))s)"
                break
              fi
              sleep 2
            done
            sleep 15

            echo "Installing debug APK (x86_64 split) with retry"
            for i in 1 2 3; do
              if adb install -r -t app/build/outputs/apk/debug/app-x86_64-debug.apk; then
                echo "Install succeeded on attempt $i"
                break
              fi
              echo "Install attempt $i failed; retrying in 15s"
              sleep 15
              if [ "$i" = "3" ]; then
                echo "Install failed after 3 attempts"
                adb shell dumpsys package 2>/dev/null | tail -50 || true
                exit 1
              fi
            done

            echo "Pre-granting runtime permissions so no system dialog interrupts a flow"
            adb shell pm grant com.landpoint.app.debug android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.landpoint.app.debug android.permission.ACCESS_COARSE_LOCATION
            echo "Seeding a GPS position the editor can capture"
            adb emu geo fix 106.8270 -6.1750

            # Cold-starting the app immediately after install on a freshly
            # booted emulator raises "Process system isn't responding" dialogs
            # that block every flow. Warm it once so the flows launch a
            # verified, jitted process.
            echo "Warming the app once before the flows"
            adb shell am start -n com.landpoint.app.debug/com.landpoint.app.MainActivity
            sleep 30
            adb shell am force-stop com.landpoint.app.debug
            sleep 5

            echo "Installing Maestro"
            curl -fsSL "https://get.maestro.mobile.dev" | bash
            # The runner action executes each script line as its own shell, so
            # an exported PATH would not survive to the next line: call the
            # binary by its absolute path instead.
            "$HOME/.maestro/bin/maestro" --version
            echo "Running flows"
            "$HOME/.maestro/bin/maestro" test .maestro/flows

      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-results
          path: |
            ~/.maestro/tests/**/*
          if-no-files-found: ignore

      - name: Upload emulator logcat
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-logcat
          path: |
            ~/logcat.txt
            /tmp/adb-screenshot.png
          if-no-files-found: ignore

  # Pushes to develop only (never on a PR): format what ktlint can fix and
  # commit it with the default GITHUB_TOKEN, so no personal token ever appears
  # in a log or a diff. Commits from GITHUB_TOKEN do not re-trigger workflows,
  # which is what keeps this from looping.
  autofix:
    name: auto-fix lint/format
    needs: changes
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Formatting is ktlint's job alone here; detekt is the analysis gate, and
      # letting two tools auto-edit the same style decisions would make them
      # fight over the files. spotless is not applied to this project.
      - name: Run ktlintFormat
        run: ./gradlew ktlintFormat

      - name: Commit and push if anything changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to auto-fix."
          else
            git add -A
            git commit -m "chore: auto-fix lint/format"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:develop
          fi
