name: CodeQL

# Security scan of the Kotlin sources. Kotlin analysis in CodeQL is limited,
# so this complements — never replaces — detekt, Android Lint and Dependabot.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - "app/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/**"
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read
  # The action reads its own workflow run to report status; without this the
  # SARIF upload step fails with "Resource not accessible by integration".
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: java-kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build for analysis (no tests, no lint)
        run: ./gradlew assembleDebug -x lintDebug -x ktlintCheck -x detekt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:java-kotlin"
