name: "CodeQL"

# CodeQL security scanning. The repo is public now, so the GitHub free plan
# covers CodeQL code-scanning results upload (the security-events: write
# permission below is what lets the analyze step push SARIF to the Security
# tab). Kotlin is analyzed under the `java` language in CodeQL — there is no
# separate `kotlin` language — and autobuild handles the Gradle build.
on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Weekly Monday 06:00 UTC — catches new CodeQL query packs released between
    # PR-driven scans without waking up every day.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for the analyze step to upload SARIF results to the Security tab.
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          # Kotlin is analyzed as part of the `java` language in CodeQL.
          languages: java
          # build-mode: none aborted at finalize with "detected code written
          # in Java/Kotlin but could not process any of it" on every run —
          # the Kotlin extractor needs to trace a real compiler invocation
          # for this project (KSP + Compose compiler). Manual build mode is
          # the documented fallback: we compile, CodeQL watches the trace.
          build-mode: manual

      # compileDebugKotlin touches every Kotlin source without running the
      # heavier full assemble pipeline the extractor does not need.
      - name: Build Kotlin for extraction
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
