name: Nightly

# A full smoke run once a night: everything CI checks, plus a debug APK
# artifact anyone can pull without waiting for a release tag. Scheduled on
# the default branch (develop's merged state reaches main; the schedule runs
# on whichever branch GitHub considers default).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly:
    name: Full test + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit tests and coverage
        run: ./gradlew :app:testDebugUnitTest :app:koverHtmlReportDebug :app:koverXmlReportDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LandPoint-nightly-debug
          retention-days: 7
          path: app/build/outputs/apk/debug/

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LandPoint-nightly-coverage
          retention-days: 7
          path: app/build/reports/kover/
          if-no-files-found: ignore
