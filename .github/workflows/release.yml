name: Build & Release

# Release builds run only from a signed tag (v1.0.0, v1.1.0-beta.1, ...). The
# signing key never lives in the repository: it arrives as the base64 of a
# password-protected zip held in GitHub Secrets, is unpacked into the workspace,
# and is gone when the runner is.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full history for changelog and version code)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Read app version
        shell: bash
        run: |
          # The version comes from the tag name (v1.0.3 → 1.0.3), not from
          # grepping build.gradle.kts. The build.gradle.kts versionName is an
          # Elvis-default expression that resolves to the tag via -PlpVersionName
          # at build time, but grepping the source only sees the default "1.0.0".
          # Using the tag directly makes the asset filenames match the release.
          version="${GITHUB_REF_NAME#v}"
          test -n "$version" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building LandPoint $version"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # KEYSTORE_ZIP_BASE64 is `base64 -w 0 key-sign-apk.zip`; the zip itself is
      # locked with KEYSTORE_PASSWORD. Everything stays in env vars so the
      # runner's secret masking covers the values end to end.
      - name: Decode signing keystore
        env:
          KEYSTORE_ZIP_BASE64: ${{ secrets.KEYSTORE_ZIP_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_ZIP_BASE64" ]; then
            echo "No KEYSTORE_ZIP_BASE64 secret; release will be UNSIGNED."
            exit 0
          fi
          printf '%s' "$KEYSTORE_ZIP_BASE64" | base64 -d > key-sign-apk.zip
          mkdir -p signing
          unzip -o -q -P "$KEYSTORE_PASSWORD" key-sign-apk.zip -d signing
          ks=$(find signing -type f \( -name '*.jks' -o -name '*.keystore' \) | head -n 1)
          test -n "$ks" || { echo "No *.jks or *.keystore inside the zip"; exit 1; }
          # app/build.gradle.kts reads these from keystore.properties at the root.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$(realpath "$ks")" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          rm -f key-sign-apk.zip
          echo "Signing keystore restored from secrets."

      # versionCode follows the history: every commit ever made to this line of
      # development bumps it, so a newer build can always replace an older one.
      - name: Compute version code
        shell: bash
        run: |
          code=$(git rev-list --count HEAD)
          test "$code" -gt 0 || { echo "empty history?"; exit 1; }
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionCode: $code"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease -PlpVersionCode="$VERSION_CODE" -PlpVersionName="${GITHUB_REF_NAME#v}"

      - name: Generate changelog from conventional commits
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The tag immediately below this one in version order, if any.
          prev=$(git tag --sort=-v:refname | grep -A1 "^${tag}\$" | tail -n 1)
          if [ "$prev" = "$tag" ] || [ -z "$prev" ]; then prev=""; fi
          if [ -n "$prev" ]; then range="${prev}..${tag}"; else range="${tag}"; fi
          {
            echo "LandPoint ${tag} — built and signed automatically on GitHub."
            echo
            echo "## Changes since ${prev:-the beginning}"
            echo
            echo "### Added"
            git log --first-parent --pretty=format:"%s" "$range" | grep -iE '^(feat|add)' | sed 's/^[^:]*: */- /' || true
            echo
            echo "### Fixed"
            git log --first-parent --pretty=format:"%s" "$range" | grep -iE '^(fix|bugfix|hotfix)' | sed 's/^[^:]*: */- /' || true
            echo
            echo "### Maintenance"
            git log --first-parent --pretty=format:"%s" "$range" | grep -iE '^(chore|refactor|perf|docs|test|ci|style|build)' | sed 's/^[^:]*: */- /' || true
            echo
            echo "### Other"
            git log --first-parent --pretty=format:"%s" "$range" | grep -viE '^(feat|add|fix|bugfix|hotfix|chore|refactor|perf|docs|test|ci|style|build|Merge pull request|Merge branch)' | sed 's/^/- /' || true
            echo
            echo "## Which file to install"
            echo
            echo '| File | For |'
            echo '|---|---|'
            echo "| \`LandPoint-$APP_VERSION-arm64-v8a.apk\` | almost every phone from 2016 on — start here |"
            echo "| \`LandPoint-$APP_VERSION-armeabi-v7a.apk\` | older 32-bit ARM phones |"
            echo "| \`LandPoint-$APP_VERSION-x86_64.apk\` | emulators, Intel/AMD tablets |"
            echo "| \`LandPoint-$APP_VERSION-x86.apk\` | older 32-bit x86 emulators |"
            echo "| \`LandPoint-$APP_VERSION-universal.apk\` | works everywhere, larger — use if unsure |"
            echo
            echo "\`LandPoint-$APP_VERSION.aab\` is the Play-Store-style bundle; sideloaders want the APKs."
            echo
            echo '## Jika instal gagal — "not valid installation package"'
            echo
            echo '1. Pastikan file yang diunduh berakhiran `.apk` — file `.aab` tidak bisa dipasang langsung di HP.'
            echo "2. Gunakan \`LandPoint-$APP_VERSION-arm64-v8a.apk\` untuk hampir semua HP, atau \`-universal.apk\` bila ragu."
            echo '3. Bila unduhan terputus, hapus lalu unduh ulang, lalu cocokkan dengan `SHA256SUMS`.'
            echo '4. Bila masih gagal, hapus dulu LandPoint yang lama, lalu pasang lagi.'
            echo '5. LandPoint butuh Android 7 (Nougat) atau lebih baru.'
            echo
            echo '- Requires Android 7 (Nougat) or newer; no Google Play Services and no map API key needed.'
            echo '- Signed with the project release key; updating an existing install is safe.'
            echo "- \`SHA256SUMS\` lists the checksum of every file above — verify with \`sha256sum -c SHA256SUMS\`."
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Five APKs: one per ABI plus a universal one. The per-ABI builds are what a
          # phone should get — each carries a single copy of the MapLibre and SQLCipher
          # native libraries instead of all four — and the universal APK is there for
          # anyone who does not know which their device is, or who keeps one file for
          # several phones.
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')
            cp "$apk" "release/LandPoint-$APP_VERSION-$abi.apk"
          done
          count=$(ls -1 release/*.apk | wc -l)
          test "$count" -eq 5 || { echo "expected 5 APKs, staged $count"; exit 1; }
          # One AAB for anyone distributing through Play-compatible channels.
          cp app/build/outputs/bundle/release/app-release.aab "release/LandPoint-$APP_VERSION.aab"
          # Checksums with bare file names, so `sha256sum -c SHA256SUMS` works in
          # whichever directory the user downloaded them into.
          (
            cd release
            sha256sum -- *.apk *.aab > SHA256SUMS
          )
          ls -l release

      # "not a valid installation package" is what a phone shows when handed an
      # unsigned or mid-signature-corrupted APK. apksigner verify fails here in
      # CI for the same file, so a bad release never reaches the user.
      - name: Verify every APK is signed and has the right versionCode
        shell: bash
        run: |
          set -euo pipefail
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          apksigner="$tools/apksigner"
          badging=$("$tools/aapt2" dump badging)
          for apk in release/*.apk; do
            "$apksigner" verify --verbose "$apk" > /dev/null
            code=$("$badging" "$apk" | grep -o "versionCode='[0-9]*'" | head -n1 | grep -o '[0-9]*')
            test "$code" = "$VERSION_CODE" || { echo "$apk: versionCode $code != expected $VERSION_CODE"; exit 1; }
            echo "OK: $(basename "$apk") — signature verified, versionCode $code"
          done

      - name: Upload mapping and reports (14 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LandPoint-${{ env.APP_VERSION }}-mapping-and-reports
          retention-days: 14
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body_path: CHANGELOG.md
          files: |
            release/*.apk
            release/*.aab
            release/SHA256SUMS
