# E2E 1 — record a land and draw its boundary by typing coordinates.
#
# Covers: first-run introduction, the Save-land flow, the corner picker's
# "Enter coordinates" source (the survey-letter path), mark acceptance, and
# the saved record appearing with its name.
#
# Preconditions established by the CI job before the flows run:
#   - the debug APK is installed,
#   - ACCESS_FINE/COARSE_LOCATION are pre-granted (no system dialog),
#   - a GPS fix is seeded with `adb emu geo fix`.
appId: com.landpoint.app.debug
name: 01-record-land-manual-coordinates
tags:
- core
---
- launchApp

# First run shows the introduction; skip it.
# A slow CI emulator sometimes raises a system "isn't responding" dialog over
# whatever is on screen; dismiss it when present so the flow can proceed.
- runFlow:
    when:
      visible: '^Wait$'
    commands:
      - tapOn: '^Wait$'

- extendedWaitUntil:
    visible: '^(Skip|Lewati)$'
    timeout: 30000
- tapOn: '^(Skip|Lewati)$'

# The list screen's big FAB.
- extendedWaitUntil:
    visible: '^(Save land|Simpan tanah)$'
    timeout: 15000
- tapOn: '^(Save land|Simpan tanah)$'

- extendedWaitUntil:
    visible: '^(Land details|Rincian tanah)$'
    timeout: 20000

# The name field (label "Name *"; "*" must be regex-escaped).
- tapOn: '^(Name|Nama) \*$'
- inputText: 'Kebun Percobaan'
- hideKeyboard

# Open the corner picker (scrolls down through the form if needed).
# The button's Text is rendered as "  " + stringResource(boundary_pick_on_map)
# in LandEditScreen.kt — i.e. two leading spaces are prepended in code to space
# the icon from its label. Anchoring with ^...$ without allowing that padding
# makes the matcher reject the element on every scroll frame, so scrollUntilVisible
# never resolves. Allow surrounding whitespace while keeping the anchored,
# bilingual shape so we don't pick up unrelated "Mark on the map" substrings.
# The Boundary card sits below Coordinates in the form. On a software
# emulator (no KVM) swipes crawl, so give the scroll a generous budget.
- scrollUntilVisible:
    element:
      text: '^\s*(Mark on the map|Tandai di peta)\s*$'
    direction: DOWN
    timeout: 60000
- tapOn: '^\s*(Mark on the map|Tandai di peta)\s*$'
# The four mark sources (by numbers, by bearing, from a neighbour, plus
# "place a mark here" from the FAB) are IconButtons whose labels reach the
# accessibility tree only as contentDescription — there is no Text node for
# Maestro's text matcher to see. Maestro matches accessibility text through
# its `id` selector (`contentDescription:` is an unknown property that would
# abort the run at parse time).
# Allow surrounding whitespace for the same reason as the Mark on the map step:
# the source string is clean but the surrounding composable or a future
# formatter could pad it, and an anchored match without tolerance would then
# silently fail to resolve.
- extendedWaitUntil:
    visible:
      id: '^\s*(Enter coordinates|Ketik koordinat)\s*$'
    timeout: 20000

# Corner 1
- tapOn:
    id: '^\s*(Enter coordinates|Ketik koordinat)\s*$'
- extendedWaitUntil:
    visible: '^(Add a corner|Tambah sudut)$'
    timeout: 10000
- tapOn: '^(Latitude|Lintang)$'
- inputText: '-6.175000'
- tapOn: '^(Longitude|Bujur)$'
- inputText: '106.827000'
- tapOn: '^(Save|Simpan)$'
- extendedWaitUntil:
    visible: '^(Use this mark|Pakai tanda ini)$'
    timeout: 10000
- tapOn: '^(Use this mark|Pakai tanda ini)$'

# Corner 2
- extendedWaitUntil:
    visible:
      id: '^\s*(Enter coordinates|Ketik koordinat)\s*$'
    timeout: 10000
- tapOn:
    id: '^\s*(Enter coordinates|Ketik koordinat)\s*$'
- tapOn: '^(Latitude|Lintang)$'
- inputText: '-6.174900'
- tapOn: '^(Longitude|Bujur)$'
- inputText: '106.827200'
- tapOn: '^(Save|Simpan)$'
- extendedWaitUntil:
    visible: '^(Use this mark|Pakai tanda ini)$'
    timeout: 10000
- tapOn: '^(Use this mark|Pakai tanda ini)$'

# Corner 3
- extendedWaitUntil:
    visible:
      id: '^\s*(Enter coordinates|Ketik koordinat)\s*$'
    timeout: 10000
- tapOn:
    id: '^\s*(Enter coordinates|Ketik koordinat)\s*$'
- tapOn: '^(Latitude|Lintang)$'
- inputText: '-6.174800'
- tapOn: '^(Longitude|Bujur)$'
- inputText: '106.827100'
- tapOn: '^(Save|Simpan)$'
- extendedWaitUntil:
    visible: '^(Use this mark|Pakai tanda ini)$'
    timeout: 10000
- tapOn: '^(Use this mark|Pakai tanda ini)$'

# Accept the boundary and save the record.
- extendedWaitUntil:
    visible: '^(Use this boundary|Pakai batas ini)$'
    timeout: 10000
- tapOn: '^(Use this boundary|Pakai batas ini)$'
- extendedWaitUntil:
    visible: '^(Save|Simpan)$'
    timeout: 15000
- tapOn: '^(Save|Simpan)$'

# The saved record shows its name, wherever the editor returns to.
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 15000
