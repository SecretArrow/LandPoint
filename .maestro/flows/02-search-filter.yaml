# E2E 2 — search narrows the list, and an impossible term empties it.
appId: com.landpoint.app.debug
name: 02-search-filter
tags:
- core
---
# A stop/launch pair gives a cold start, which lands on the Parcels tab no
# matter which screen the previous flow ended on (the Parcels tab absorbed the
# old Home dashboard as its header, ADR-002).
- stopApp
- launchApp

# A slow CI emulator sometimes raises a system "isn't responding" dialog over
# whatever is on screen; dismiss it when present so the flow can proceed.
- runFlow:
    when:
      visible: '^Wait$'
    commands:
      - tapOn: '^Wait$'

# The Parcels tab carries the old Home dashboard as its scrolling header
# (ADR-002), and its recent-activity rows grow as the flows before this one
# create and delete parcels — on a cold start the first card can sit below
# the fold. Scroll the list until the card shows instead of asserting from
# wherever the launch landed.
- scrollUntilVisible:
    element:
      text: 'Kebun Percobaan'
    direction: DOWN
    timeout: 30000

# The search field lives behind the Parcels tab's top-bar icon.
- tapOn: '^(Parcels|Bidang)$'
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 15000

# Open the search field (the top-bar icon carries the content description).
- tapOn: '^(Search|Cari)$'
- inputText: 'Percobaan'
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 10000

# An impossible term must produce the no-matches state, not a stale list.
- tapOn: '^(Clear search|Bersihkan pencarian)$'
- inputText: 'zzzz-no-such-land'
- extendedWaitUntil:
    visible: '^(No matches|Tidak ditemukan)$'
    timeout: 10000

# Leave the list clean for the flows that follow. Clearing the query brings
# the Parcels dashboard header back, which pushes the card down behind the
# still-open keyboard — the card is on screen but under the IME, so close
# the keyboard before asserting on it.
- tapOn: '^(Clear search|Bersihkan pencarian)$'
- hideKeyboard
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 10000
