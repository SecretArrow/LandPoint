# E2E 2 — search narrows the list, and an impossible term empties it.
appId: com.landpoint.app.debug
name: 02-search-filter
tags:
- core
---
# A stop/launch pair gives a cold start, which lands on the list tab no
# matter which screen the previous flow ended on.
- stopApp
- launchApp

# A slow CI emulator sometimes raises a system "isn't responding" dialog over
# whatever is on screen; dismiss it when present so the flow can proceed.
- runFlow:
    when:
      visible: '^Wait$'
    commands:
      - tapOn: '^Wait$'

- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 20000

# Open the search field (the top-bar icon carries the content description).
- tapOn: '^(Search|Cari)$'
- inputText: 'Percobaan'
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 10000

# An impossible term must produce the no-matches state, not a stale list.
- tapOn: '^(Clear search|Bersihkan pencarian)$'
- inputText: 'zzzz-no-such-land'
- extendedWaitUntil:
    visible: '^(No matches|Tidak ditemukan)$'
    timeout: 10000

# Leave the list clean for the flows that follow.
- tapOn: '^(Clear search|Bersihkan pencarian)$'
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 10000
- hideKeyboard
