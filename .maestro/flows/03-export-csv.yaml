# E2E 3 — export a selection as CSV through the system save picker.
#
# Covers: multi-select, "select all shown", the export-format dialog, and the
# SAF save sheet (its SAVE button is part of the system UI, in caps on API 30).
appId: com.landpoint.app.debug
name: 03-export-csv
tags:
- core
---
- stopApp
- launchApp

# A slow CI emulator sometimes raises a system "isn't responding" dialog over
# whatever is on screen; dismiss it when present so the flow can proceed.
- runFlow:
    when:
      visible: '^Wait$'
    commands:
      - tapOn: '^Wait$'

- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 20000

# Selection mode lives on the Lands tab; a long-press on the dashboard's
# "Recent parcels" row opens the detail screen instead.
- tapOn: '^(Lands|Tanah)$'
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 15000

# Long-press a card to enter selection mode. With a single land the ticked
# card already IS "all shown", so the select-all button stays hidden by
# design — the selection bar is the thing to assert, then export straight
# away. ("1 selected" / "1 dipilih".)
- longPressOn: 'Kebun Percobaan'
- extendedWaitUntil:
    visible: '^(1 selected|1 dipilih)$'
    timeout: 10000

- tapOn: '^(Export selected|Ekspor yang dipilih)$'
- extendedWaitUntil:
    visible: '^(Export selected as|Ekspor pilihan sebagai)$'
    timeout: 10000

- tapOn: '^(Export CSV|Ekspor CSV)$'

# The system save sheet: the file name is pre-filled, SAVE confirms.
- extendedWaitUntil:
    visible: '^SAVE$'
    timeout: 15000
- tapOn: '^SAVE$'

# Back in the app, the confirmation message appears.
# Maestro regexes must match the whole node text, so anchor around the
# localized toast: "Exported 1 location" / "1 lokasi diekspor".
- extendedWaitUntil:
    visible: '^(Exported .*|.*diekspor)$'
    timeout: 15000
