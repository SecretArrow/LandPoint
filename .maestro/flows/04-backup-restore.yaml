# E2E 4 — a password-protected backup survives a wipe and comes back whole.
#
# Covers: the Settings backup flow with a passphrase, the system save sheet,
# deleting every record, and restoring the backup from the saved file.
appId: com.landpoint.app.debug
name: 04-backup-restore
tags:
- core
---
- stopApp
- launchApp

# A slow CI emulator sometimes raises a system "isn't responding" dialog over
# whatever is on screen; dismiss it when present so the flow can proceed.
- runFlow:
    when:
      visible: '^Wait$'
    commands:
      - tapOn: '^Wait$'

- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 20000

# --- Make an encrypted backup -------------------------------------------
- tapOn: '^(Settings|Pengaturan)$'
# The backup section sits below the language and appearance cards — scroll
# to the header instead of asserting on it from the top of the screen.
- scrollUntilVisible:
    element:
      text: '^(Backup and export|Pencadangan dan ekspor)$'
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '^(Full backup \(with photos\)|Cadangan lengkap \(dengan foto\))$'
    direction: DOWN
    timeout: 20000
- tapOn: '^(Full backup \(with photos\)|Cadangan lengkap \(dengan foto\))$'

# Passphrase dialog: type the passphrase twice, then confirm.
- tapOn: '^(Password|Sandi)$'
- inputText: 'rahasia123'
- tapOn: '^(Repeat password|Ulangi sandi)$'
- inputText: 'rahasia123'
- hideKeyboard
- tapOn: '^(Use a password|Pakai sandi)$'

# System save sheet with a pre-filled file name.
- extendedWaitUntil:
    visible: '^SAVE$'
    timeout: 15000
- tapOn: '^SAVE$'

# Toast text is "Backup saved: 1 locations, 0 photos" — full-match regex.
- extendedWaitUntil:
    visible: '^(Backup saved.*|Cadangan tersimpan.*)$'
    timeout: 20000

# The toast pops while the system save sheet is still closing, so the
# back press above once closed the sheet instead of Settings. Wait for
# the Settings screen to have focus again first.
- extendedWaitUntil:
    visible: '^(Settings|Pengaturan)$'
    timeout: 20000

# --- Wipe every record ---------------------------------------------------
# Settings is a full-screen page without the bottom bar — back to the
# dashboard first, then across to Lands.
- back
- tapOn: '^(Lands|Tanah)$'
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 15000

- longPressOn: 'Kebun Percobaan'
- extendedWaitUntil:
    visible: '^(1 selected|1 dipilih)$'
    timeout: 10000
- tapOn: '^(Delete selected|Hapus yang dipilih)$'
- extendedWaitUntil:
    visible: '^(Delete|Hapus)$'
    timeout: 10000
- tapOn: '^(Delete|Hapus)$'

# The list is empty again.
- extendedWaitUntil:
    visible: '^(No land saved yet|Belum ada tanah tersimpan)$'
    timeout: 15000

# --- Restore the backup --------------------------------------------------
# Settings lives behind the gear on the Home dashboard; the Lands tab has
# no settings entry of its own.
- tapOn: '^(Home|Beranda)$'
- extendedWaitUntil:
    visible: '^(Settings|Pengaturan)$'
    timeout: 15000
- tapOn: '^(Settings|Pengaturan)$'
- scrollUntilVisible:
    element:
      text: '^(Restore and import|Pemulihan dan impor)$'
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '^(Restore full backup|Pulihkan cadangan lengkap)$'
    direction: DOWN
    timeout: 20000
- tapOn: '^(Restore full backup|Pulihkan cadangan lengkap)$'

# The system file picker opens where the last file was saved (Downloads);
# the backup's name carries a timestamp, so match it as a regex.
- extendedWaitUntil:
    visible: '^landpoint-backup-.*\.lpbk$'
    timeout: 20000
- tapOn: '^landpoint-backup-.*\.lpbk$'

# The backup is locked: give it the passphrase.
- extendedWaitUntil:
    visible: '^(This backup is locked|Backup ini terkunci)$'
    timeout: 15000
- tapOn: '^(Password|Sandi)$'
- inputText: 'rahasia123'
- hideKeyboard
- tapOn: '^(Open|Buka)$'

# The summary snackbar ("Imported 1") confirms the restore ran.
# Toast text is "Imported 1" / "1 diimpor" — full-match regex.
- extendedWaitUntil:
    visible: '^(Imported.*|.*diimpor)$'
    timeout: 20000

- tapOn: '^(Lands|Tanah)$'
- extendedWaitUntil:
    visible: 'Kebun Percobaan'
    timeout: 15000
