# E2E 5 — an owner can be recorded and appears in the list.
#
# Covers: the owners list on its Tools-tab card (the Owners tab stopped being a
# tab in ADR-002's four-tab structure), the add-owner form, inline validation
# happening on save (not before), and the saved owner showing up with the NIK
# summary.
appId: com.landpoint.app.debug
name: 05-owner-add
tags:
- core
---
- stopApp
- launchApp

# A slow CI emulator sometimes raises a system "isn't responding" dialog over
# whatever is on screen; dismiss it when present so the flow can proceed.
- runFlow:
    when:
      visible: '^Wait$'
    commands:
      - tapOn: '^Wait$'

# The Parcels tab carries the old Home dashboard as its scrolling header
# (ADR-002), and its recent-activity rows grow as the flows before this one
# create and delete parcels — flow 04's delete + restore added two more. On
# a cold start the first card can sit below the fold, so scroll the list
# until the card shows instead of asserting from wherever the launch landed.
- scrollUntilVisible:
    element:
      text: 'Kebun Percobaan'
    direction: DOWN
    timeout: 30000

# The Owners tab stopped being a tab in the four-tab restructure (ADR-002);
# the list now lives one card away on the Tools tab. Scroll to the card so a
# tall screen of Export/Backup/Restore cards cannot push it under the fold.
- tapOn: '^(Tools|Alat)$'
- scrollUntilVisible:
    element:
      text: '^(Owners|Pemilik)$'
    direction: DOWN
    timeout: 30000
- tapOn: '^(Owners|Pemilik)$'
- extendedWaitUntil:
    visible: '^(Add owner|Tambah pemilik)$'
    timeout: 15000

# The empty state is part of the contract: it explains what the tab is for.
- extendedWaitUntil:
    visible: 'No owner saved yet|Belum ada pemilik tersimpan'
    timeout: 10000

- tapOn: '^(Add owner|Tambah pemilik)$'
- extendedWaitUntil:
    visible: '^(Full name \*|Nama lengkap \*)$'
    timeout: 10000

# Save with nothing typed: the form explains itself rather than just failing.
- tapOn: '^(Save|Simpan)$'
# The message continues "...to recognise this owner later" — an unanchored
# alternation has to match the whole node text, so widen it.
- extendedWaitUntil:
    visible: '^(A name is needed.*|Nama diperlukan.*)$'
    timeout: 10000

- tapOn: '^(Full name \*|Nama lengkap \*)$'
- inputText: 'Budi Santoso'
# The open keyboard covers the NIK field below; put it away first. The
# label is "NIK (identity number)" in English and just "NIK" in
# Indonesian — a plain tapOn string matches exactly, so use a regex.
- hideKeyboard
- tapOn: '^NIK.*$'
- inputText: '3201234567890001'
- hideKeyboard
- tapOn: '^(Save|Simpan)$'

- extendedWaitUntil:
    visible: 'Budi Santoso'
    timeout: 15000
# The list row renders the NIK as one line: "NIK 3201234567890001" — a
# plain string must match the whole node, so wrap it in a regex.
- extendedWaitUntil:
    visible: '^.*3201234567890001.*$'
    timeout: 10000
